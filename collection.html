<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>コレクション — アート記録</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="tab-bar">
    <button class="menu-btn" id="menuBtn">☰</button>
    <div class="tabs">
      <a href="index.html" class="tab">記録する</a>
      <a href="collection.html" class="tab active">コレクション</a>
    </div>
  </div>

  <div class="container">
    <div class="collection-empty hidden" id="collectionEmpty">
      <p>まだ作品が保存されていません</p>
      <a href="index.html" class="empty-link">最初の作品を追加する</a>
    </div>
    <div class="collection-toolbar hidden" id="collectionToolbar">
      <button class="sort-btn" id="sortBtn">新しい順</button>
    </div>
    <div id="collectionGrid"></div>
  </div>

  <!-- Detail modal -->
  <div class="modal hidden" id="modal">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-content">
      <button class="modal-close" id="modalClose">✕</button>
      <img class="modal-image" id="modalImage" alt="">
      <div class="modal-info">
        <div class="result-item">
          <span class="result-label">作者</span>
          <input class="result-input" id="modalArtist" type="text" placeholder="不明">
        </div>
        <div class="result-item">
          <span class="result-label">タイトル</span>
          <input class="result-input" id="modalTitle" type="text" placeholder="不明">
        </div>
        <div class="result-item">
          <span class="result-label">制作年</span>
          <input class="result-input" id="modalYear" type="text" placeholder="不明">
        </div>
        <div class="result-item result-item--memo">
          <span class="result-label">メモ</span>
          <textarea class="result-input result-memo" id="modalMemo" placeholder="メモなし"></textarea>
        </div>
      </div>
      <button class="modal-save-btn" id="modalSave">変更を保存</button>
      <button class="delete-btn" id="modalDelete">削除する</button>
    </div>
  </div>

  <!-- Side drawer -->
  <div class="drawer" id="drawer">
    <div class="drawer-backdrop" id="drawerBackdrop"></div>
    <div class="drawer-panel">
      <p class="drawer-title">設定</p>
      <div class="drawer-section">
        <label for="apiKeyInput">Gemini APIキー</label>
        <input type="password" id="apiKeyInput" class="drawer-input" placeholder="AIzaSy...">
        <button class="drawer-save-btn" id="saveKeyBtn">保存する</button>
        <p class="api-key-hint" id="apiKeyStatus"></p>
      </div>
    </div>
  </div>

  <script src="drawer.js"></script>
  <script src="db.js"></script>
  <script src="collection.js"></script>
</body>
</html>
